<svg xmlns="http://www.w3.org/2000/svg" width="622" height="622" viewBox="-8 -8 316 316" role="img" aria-label="BYS Permis">
  <title>BYS Permis</title>

  <!--
    Losange de reference : (150,0) (300,150) (150,300) (0,150), centre (150,150).
    Chevron = aretes gauches epaissies de 62, bouts coupes perpendiculairement au bras.
    Losange plein = quart droit : centre -> pointe droite.
    viewBox avec 8px de marge : rien ne touche le bord.
  -->

  <defs>
    <linearGradient id="bysNavyT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E4570"/>
      <stop offset="0.55" stop-color="#1B2E58"/>
      <stop offset="1" stop-color="#0E1A38"/>
    </linearGradient>
  </defs>

  <path d="M150 0 L0 150 L150 300 L181 269 L62 150 L181 31 Z" fill="url(#bysNavyT)"/>
  <path d="M225 75 L300 150 L225 225 L150 150 Z" fill="url(#bysNavyT)"/>
</svg>
